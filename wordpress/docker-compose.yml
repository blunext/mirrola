# Environment shared by wordpress and wpcli (both load wp-config.php, which
# takes every secret from here). ":?" stops compose when .env lacks a value.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:?set in .env}
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?set in .env}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set in .env}
  WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?set in .env}
  WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?set in .env}
  WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?set in .env}
  WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?set in .env}
  WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?set in .env}
  WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?set in .env}
  WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?set in .env}
  WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?set in .env}
  WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?set in .env}

services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 1s
      retries: 5

  wordpress:
    image: wordpress:6.7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    restart: always
    container_name: wordpress
    environment: *wp-env
    volumes:
      - ./public_html:/var/www/html
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 1m
      timeout: 10s
      retries: 3

  # WP-CLI for one-off commands (search-replace after an import). Not started by
  # "docker compose up"; run it with: docker compose run --rm wpcli <args>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes:
      - ./public_html:/var/www/html
    networks:
      - wordpress_network

volumes:
  db_data:
  wordpress_data:

networks:
  wordpress_network:
    driver: bridge
