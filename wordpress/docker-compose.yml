# Environment of the wordpress service (wp-config.php takes every secret from
# here; the tools services get the whole .env through env_file). ":?" stops
# compose when .env lacks a value.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:?set in .env}
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?set in .env}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set in .env}
  WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?set in .env}
  WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?set in .env}
  WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?set in .env}
  WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?set in .env}
  WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?set in .env}
  WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?set in .env}
  WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?set in .env}
  WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?set in .env}
  WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?set in .env}

services:
  db:
    image: mariadb:10.6
    restart: always
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 1s
      retries: 5

  wordpress:
    image: wordpress:7.1.5-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # same port inside: see apache/ports.conf
    restart: always
    container_name: wordpress
    environment: *wp-env
    volumes:
      # WordPress files live in a Docker volume, filled by "make start" from
      # the latest R2 snapshot (wp-config.php and .htaccess come from config/).
      - wp_files:/var/www/html
      - ./apache/ports.conf:/etc/apache2/ports.conf:ro
      - ./apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 1m
      timeout: 10s
      retries: 3
      # Checked every 2 s right after a start, so "up --wait" (make start)
      # returns as soon as WordPress answers.
      start_period: 1m
      start_interval: 2s

  # Tools: snapshots to R2 (restic), start from R2, crawl and publish, WP-CLI.
  # Built from this repository (wordpress/tools/Dockerfile); run through make,
  # e.g. docker compose run --rm --build tools snapshot.
  # "tools" sees the WordPress files read-only (snapshots); "tools-restore"
  # writes them (make start, with WordPress stopped).
  tools: &tools
    build:
      context: ..
      dockerfile: wordpress/tools/Dockerfile
    image: olamundo-tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    # The whole .env, read by compose itself: unlike ${VAR} interpolation,
    # variables of the calling shell (e.g. a private RESTIC_REPOSITORY) can't
    # override it.
    env_file: .env
    volumes:
      - wp_files:/data/public_html:ro
      - tools_cache:/cache
      # The DB dump exists only in memory.
      - type: tmpfs
        target: /data/db
        tmpfs:
          mode: 01777
      # The site repo (blunext/olamundo), cloned on first use.
      - site:/site
      # This computer's deploy key for the site repo (gitignored).
      - ./deploy:/run/deploy:ro
      # make check's report (.check/report.txt, crawl.log).
      - ../.check:/report
    networks:
      - wordpress_network

  tools-restore:
    <<: *tools
    volumes:
      - wp_files:/data/public_html
      - ./config:/config:ro
      - tools_cache:/cache
      - type: tmpfs
        target: /data/db
        tmpfs:
          mode: 01777

volumes:
  db_data:
  wp_files:
  # restic's cache (owned by uid 33, the tools user)
  tools_cache:
  site:

networks:
  wordpress_network:
    driver: bridge
